name: eaglesakura/agent-skills
version: 0.1.0
description: |
  github.com/eaglesakura/agent-skills の Agent Packages.
  このapm.ymlは、参考かつ、Agent開発用のローカルpathで記載する

targets:
  - cursor

dependencies:
  apm:
    - microsoft/apm/packages/apm-guide#v0.26.0
    - path: ./packages/agentic-workspace
    - path: ./packages/cursor-extensions
    - path: ./packages/agent-creator
    - path: ./packages/machine
    - path: ./packages/github
    - path: ./packages/flutter
    - path: ./packages/golang
    - path: ./packages/coding-xm3
    - path: ./packages/ohitorisama
