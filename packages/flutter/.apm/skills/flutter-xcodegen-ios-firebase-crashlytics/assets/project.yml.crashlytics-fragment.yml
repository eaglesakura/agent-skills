# project.yml への追記断片（Firebase Crashlytics）
#
# 使い方:
# - targets.Runner.dependencies に dependencies をマージする
# - targets.Runner.postBuildScripts に postBuildScripts をマージする
#   （Thin Binary の後でよい）
# - 同梱の xcodegen/scripts/preBuildFirebaseCrashlyticsRun.sh を
#   ios/xcodegen/scripts/ へ配置する（実行ビット付き）

targets:
  Runner:
    dependencies:
      - product: FirebaseCrashlytics
        package: firebase-ios-sdk
    postBuildScripts:
      - name: "[Firebase] Crashlytics Upload Symbols"
        script: "${PROJECT_DIR}/xcodegen/scripts/preBuildFirebaseCrashlyticsRun.sh"
        inputFiles:
          - ${DWARF_DSYM_FOLDER_PATH}/${DWARF_DSYM_FILE_NAME}
          - ${DWARF_DSYM_FOLDER_PATH}/${DWARF_DSYM_FILE_NAME}/Contents/Resources/DWARF/${PRODUCT_NAME}
          - ${DWARF_DSYM_FOLDER_PATH}/${DWARF_DSYM_FILE_NAME}/Contents/Info.plist
          - $(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/GoogleService-Info.plist
          - $(TARGET_BUILD_DIR)/$(EXECUTABLE_PATH)
        basedOnDependencyAnalysis: false
